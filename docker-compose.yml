version: '3.8'

services:
  # 1. 你的 Python App
  flask-app:
    build: ./app
    container_name: flask-app
    ports:
      - "5000:5000"
    networks:
      - monitoring-net

  # 2. Prometheus (數據收集器)
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - monitoring-net

  # 3. Grafana (數據視覺化)
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin  # 初始密碼
    networks:
      - monitoring-net

networks:
  monitoring-net:
    driver: bridge
