# 1. 工作流的名稱 (隨便取，方便你在 GitHub 介面辨識)
name: Docker Build and Push Pipeline

# 2. 觸發條件 (Trigger)
# 這裡設定為：只有當程式碼 push 到 main 分支，或是發送 Pull Request 到 main 時，才會執行
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 3. 定義要執行的任務 (Jobs)
jobs:
  build-and-push:
    # 指定在什麼環境執行 (通常使用 GitHub 提供的 Ubuntu 虛擬機)
    runs-on: ubuntu-latest

    # 4. 定義具體的步驟 (Steps)
    steps:
      # Step 1: 檢查代碼 (Checkout)
      # 使用官方提供的 action，把你的程式碼從 Git 倉庫「拉」到這台虛擬機裡
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: 登入 Docker Hub
      # 這一步需要用到你設定在 GitHub Secrets 裡的帳號密碼
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 3: 設定 Docker Buildx (這是為了支援更強大的構建功能，例如多平台構建)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: 執行 Build 並 Push
      # 這一步會根據你的 Dockerfile 進行構建，並推送到 Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .          # 構建的上下文，"." 代表當前目錄
          push: true          # 是否要執行 push 到遠端
          tags: |             # 設定 Image 的標籤 (Tag)
            jajye033/my-app:latest
            jajye033/my-app:${{ github.sha }} 
            # github.sha 會自動帶入該次 Commit 的 ID，方便追蹤版本
