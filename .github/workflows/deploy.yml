name: Full System CI/CD (App + Monitoring)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 這裡我們要同時構建 App 和 監控組件的 Image (如果需要的話)
      - name: Build and push Flask App
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:${{ github.sha }}

  deploy:
    runs-on: self-hosted
    needs: build-and-push
    steps:
      - name: Deploy Local Stack
        run: |
          # 1. 進入伺服器上的專案目錄
          cd /home/ubuntu/my-devops-project

          # 2. 拉取最新代碼
          git pull origin main

          # 3. 重新啟動整個系統
          echo "🚀 Restarting the entire stack locally..."
          docker-compose down
          docker-compose up -d

          # 4. 清理舊的影像
          docker image prune -f
          
          echo "✅ Entire stack is up to date!"
