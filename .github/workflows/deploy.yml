name: Full System CI/CD (App + Monitoring)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 這裡我們要同時構建 App 和 監控組件的 Image (如果需要的話)
      - name: Build and push Flask App
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:${{ github.sha }}

  deploy:
    runs-on: self-hosted
    needs: build-and-push
    steps:
      - name: Execute remote commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            # 1. 進入伺服器上的專案目錄 (假設你已經預先在伺服器建立好這個資料夾)
            cd /home/ubuntu/my-devops-project

            # 2. 這裡最關鍵：你需要把新的 docker-compose.yml 與設定檔「同步」到伺服器
            # 在真實環境，通常會用 git pull 或 rsync 把最新的代碼拉下來
            git pull origin main

            # 3. 重新啟動整個系統
            echo "🚀 Restarting the entire stack..."
            docker-compose down
            docker-compose up -d

            # 4. 清理舊的影像
            docker image prune -f
            
            echo "✅ Entire stack (App + Prometheus + Grafana) is up to date!"
