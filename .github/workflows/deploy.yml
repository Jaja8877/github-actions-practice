name: Full CI/CD Pipeline (Build & Deploy)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # 允許手動執行

jobs:
  # 第一個任務：Build and Push (CI)
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }}

  # 第二個任務：Deploy (CD)
  # 注意這裡的 'needs: build-and-push' 是關鍵！
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push  # <--- 核心重點：必須等 CI 成功後，才開始執行部署
    steps:
      - name: Execute remote commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            echo "🚀 Starting deployment..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest
            docker stop my-app-container || true
            docker rm my-app-container || true
            docker run -d --name my-app-container -p 80:80 ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest
            docker image prune -f
            echo "✅ Deployment Complete!"
