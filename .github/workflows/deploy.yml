name: Full System CI/CD (App + Monitoring)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 這裡我們要同時構建 App 和 監控組件的 Image (如果需要的話)
      - name: Build and push Flask App
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:${{ github.sha }}

  deploy:
    runs-on: self-hosted
    needs: build-and-push
    steps:
      # 1. 必須先在 deploy 階段也把代碼 check 下來，這樣目錄下才有 docker-compose.yml
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 直接在當前 workspace 執行重啟
      - name: Deploy Local Stack
        run: |
          echo "當前工作目錄是: $(pwd)"
          
          # 不需要 git pull 了，因為 actions/checkout 已經幫你拿到了最新代碼
          echo "🚀 Restarting the entire stack locally..."
          docker-compose down
          docker-compose up -d

          # 清理舊的影像
          docker image prune -f
          
          echo "✅ Entire stack is up to date!"
