name: Full CI/CD Pipeline (Build & Deploy)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # 第一個任務：Build and Push (CI)
  build-and-push:
    # 🔥 重點：改成 self-hosted，這樣它才會在你的 WSL2 執行！
    runs-on: self-hosted 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/my-app:${{ github.sha }}

  # 第二個任務：Deploy (CD)
  deploy:
    runs-on: self-hosted  # 🔥 同樣改為 self-hosted
    needs: build-and-push
    steps:
      # 注意：因為是在本地執行，我們甚至不需要 SSH！
      # 我們可以直接下指令操作本地的 Docker
      - name: Deploy to Local Docker
        run: |
          echo "🚀 Starting local deployment..."
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest
          docker stop my-app-container || true
          docker rm my-app-container || true
          docker run -d --name my-app-container -p 8000:8000 ${{ secrets.DOCKERHUB_USERNAME }}/my-app:latest
          docker image prune -f
          echo "✅ Deployment Complete on WSL2!"
