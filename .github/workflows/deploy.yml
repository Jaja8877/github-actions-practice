name: Flask CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: self-hosted  # 使用你的 WSL2 Runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app            # 注意：這裡要指向 app 資料夾
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:${{ github.sha }}

  deploy:
    runs-on: self-hosted
    needs: build-and-push
    steps:
      - name: Deploy to Local Docker
        run: |
          echo "🚀 Starting deployment..."
          # 1. 拉取最新映像檔
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:latest
          
          # 2. 停止並移除舊容器 (如果存在的話)
          docker stop flask-container || true
          docker rm flask-container || true
          
          # 3. 啟動新容器 (將 5000 端口對應到主機的 5000)
          docker run -d --name flask-container -p 5000:5000 ${{ secrets.DOCKERHUB_USERNAME }}/flask-app:latest
          
          # 4. 清理舊映像檔
          docker image prune -f
          
          echo "✅ Deployment Complete! Check http://localhost:5000"
