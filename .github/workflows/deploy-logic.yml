name: CD Deployment Logic Practice

on:
  # 我們設定為：當 main 分支有新的 push，或是手動執行時觸發
  push:
    branches: [ "main" ]
  workflow_dispatch: # 讓你可以點按鈕手動測試

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: 檢查代碼 (雖然部署主要用指令，但通常還是會 Checkout)
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: 遠端指令執行 (這是最核心的部分)
      # 我們使用 appleboy/ssh-action，它是業界處理 SSH 部署的標準工具
      - name: Execute remote commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          # --- 以下這些變數，就是你未來需要去 GitHub Secrets 設定的內容 ---
          host: ${{ secrets.SSH_HOST }}     # 伺服器的 IP 位址
          username: ${{ secrets.SSH_USER }} # 伺服器的登入帳號 (例如: ubuntu)
          key: ${{ secrets.SSH_KEY }}       # 伺服器的 SSH Private Key (非常重要！)
          port: 22                           # SSH 預設埠號
          
          # --- 這裡寫下你「想要在伺服器上執行的所有指令」 ---
          script: |
            echo "🚀 開始執行部署流程..."
            
            # 1. 先拉取最新的 Docker Image (這需要你之前 CI 已經 Push 成功)
            echo "Step 1: Pulling latest image from Docker Hub..."
            docker pull jajye033/my-app:latest
            
            # 2. 停止並移除舊的容器 (如果舊的還在跑的話)
            # || true 的意思是：如果舊容器不存在，也不要報錯中斷流程
            echo "Step 2: Stopping and removing old container..."
            docker stop my-app-container || true
            docker rm my-app-container || true
            
            # 3. 用新的 Image 啟動新容器
            echo "Step 3: Starting new container..."
            docker run -d \
              --name my-app-container \
              -p 80:80 \
              your-docker-username/my-app:latest
            
            # 4. 清理不再需要的舊 Image (避免伺服器硬碟爆掉)
            echo "Step 4: Cleaning up old images..."
            docker image prune -f
            
            echo "✅ 部署完成！現在你的服務應該已經更新了。"
